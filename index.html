<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Grace IA - Assistente virtual inteligente"
    >

    <title>Grace IA | Assistente Virtual</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- CABEÇALHO -->

        <header class="header">

            <div class="brand">

                <div class="grace-avatar">
                    G
                </div>

                <div class="brand-info">

                    <h1>Grace IA</h1>

                    <div class="status">
                        <span class="status-dot"></span>
                        Online
                    </div>

                </div>

            </div>

            <button
                class="menu-button"
                id="menuButton"
                aria-label="Abrir menu"
            >
                ⋮
            </button>

        </header>


        <!-- ÁREA DO CHAT -->

        <main
            class="chat"
            id="chat"
        >

            <!-- APRESENTAÇÃO -->

            <section class="welcome">

                <div class="welcome-avatar">
                    G
                </div>

                <h2>Olá! 👋</h2>

                <p>
                    Eu sou a Grace, sua assistente virtual.
                    Como posso ajudar você hoje?
                </p>

            </section>


            <!-- BOTÕES RÁPIDOS -->

            <section class="quick-actions">

                <button
                    class="quick-button"
                    data-message="Quero saber os horários"
                >
                    <span>🕐</span>
                    <strong>Horários</strong>
                </button>


                <button
                    class="quick-button"
                    data-message="Quero conhecer os serviços"
                >
                    <span>✨</span>
                    <strong>Serviços</strong>
                </button>


                <button
                    class="quick-button"
                    data-message="Quero saber as formas de pagamento"
                >
                    <span>💳</span>
                    <strong>Pagamento</strong>
                </button>


                <button
                    class="quick-button"
                    data-message="Quero falar com um atendente"
                >
                    <span>👤</span>
                    <strong>Atendente</strong>
                </button>

            </section>


            <!-- MENSAGENS -->

            <div id="messages"></div>

        </main>


        <!-- DIGITANDO -->

        <div
            class="typing"
            id="typing"
        >
            <span></span>
            <span></span>
            <span></span>
            Grace está digitando...
        </div>


        <!-- CAMPO DE MENSAGEM -->

        <form
            class="message-form"
            id="messageForm"
        >

            <input
                type="text"
                id="messageInput"
                placeholder="Digite sua mensagem..."
                autocomplete="off"
                aria-label="Mensagem"
            >

            <button
                type="submit"
                class="send-button"
                aria-label="Enviar mensagem"
            >
                ➤
            </button>

        </form>


        <!-- RODAPÉ -->

        <div class="footer">
            Grace IA • Assistente virtual
        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>

    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
